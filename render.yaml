services:
  - type: web
    name: epd-carbon-prototype
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: >
      streamlit run frontpage.py
      --server.address 0.0.0.0
      --server.port $PORT
      --server.headless true
      --browser.gatherUsageStats false

    envVars:
      # auto = Google Drive when the three GDRIVE_* values are set, otherwise local disk.
      # On Render's free plan the local disk is wiped on every deploy/restart, so use Drive.
      - key: EPD_STORAGE_BACKEND
        value: auto
      - key: EPD_DATA_DIR
        value: /tmp/epd_store
      - key: GDRIVE_FOLDER_NAME
        value: EPD_Prototype_Store
      - key: GDRIVE_CLIENT_ID
        sync: false
      - key: GDRIVE_CLIENT_SECRET
        sync: false
      - key: GDRIVE_REFRESH_TOKEN
        sync: false
